<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Demo | StudentHub</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <main class="container" id="main-content">
        <header class="page-heading">
            <h1>Events JSON API demo</h1>
            <p>Shows the GET API response with Fetch.</p>
        </header>
        <section class="panel"><button class="button" id="load">Load API events</button>
            <pre id="result" aria-live="polite">Click the button to load data.</pre>
        </section>
        <p><a href="index.php">Return to StudentHub</a></p>
    </main>
    <script>document.querySelector('#load').addEventListener('click', async () => { const out = document.querySelector('#result'); out.textContent = 'Loading…'; try { const response = await fetch('api/events.php'); const data = await response.json(); out.textContent = JSON.stringify(data, null, 2) } catch (e) { out.textContent = 'Could not load API. Start Apache/MySQL and import the database.' } });</script>
</body>

</html>
